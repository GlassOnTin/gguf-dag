[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-dag"
version = "0.1.0"
description = "Content-addressed, hash-chained packing of GGUF model files with byte-identical rebuild"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "Ian" }]

[project.scripts]
gguf-dag = "gguf_dag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]